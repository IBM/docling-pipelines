[project.optional-dependencies]
dev = [
    "black==26.1.0",
    "detect-secrets==1.5.0",
    "faker==40.8.0",
    "flake8==7.3.0",
    "httpx==0.28.1",  # For testing FastAPI
    "mypy==1.19.1",
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.5",
]

notebooks = [
    "jupyter==1.1.1",
    "ipykernel==7.3.0",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
    "nbformat==5.10.4",
    "nbconvert==7.17.1",
]

vlm_asr = [
    "docling[vlm,asr]",
]

[project.scripts]
docling-pipelines-api = "docpipe.api.main:app"
docling-pipelines = "docpipe.cli.docpipe_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docpipe"]


[tool.hatch.build]
exclude = [
    ".venv/**",
    ".vtest/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv/",
    ".vtest/",
    "*.pyc",
    "__pycache__/"
]

[tool.uv]
# Ensure uv resolves dependencies for Linux x86_64 environments (Jenkins CI)
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

override-dependencies = [
    "numpy>=1.25.0,<2.0.0",
    # scipy>=1.18.0 requires numpy>=2.0.0 which conflicts with the numpy<2.0.0 pin above.
    # Pin to <1.18.0 to prevent the Docker build resolving a breaking scipy version.
    "scipy>=1.13.0,<1.18.0",
# Pin rapidocr to 3.9.0 within docling-slim's >=3.8,<4.0 constraint.
    "rapidocr==3.9.0",
    # CVE-2026-59939: Security fix for httplib2 vulnerability (transitive via google-auth-httplib2).
    "httplib2>=0.32.0",
    # CVE-2026-49476, CVE-2026-49477: Security fix for soupsieve vulnerability (transitive via beautifulsoup4).
    "soupsieve>=2.8.4",
    # CVE-2026-59180: Security fix - upgrade apprise (prefect transitive dep) to >=1.11.0
    "apprise>=1.11.0",
]

[tool.ruff]
# Set the maximum line length to 120 characters
line-length = 120
# Target Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (E, W), Pyflakes (F), isort (I), and other useful rules
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]
# Ignore specific rules if needed
ignore = [
    "UP035",  # Import from `collections.abc` instead of `typing` (keep typing imports)
    "E501",   # Line too long (let formatter handle line length)
    "SIM",    # flake8-simplify - ignore all simplification suggestions (nested structures, etc.)
    "N818",   # Exception name should end with Error suffix
    "B027",   # Empty method in abstract base class without abstract decorator (intentional for optional overrides)
]

[tool.ruff.lint.isort]
# Configure import sorting
# NOTE: Ruff's isort implementation is the single source of truth for import sorting.
# No conflicting isort configurations exist in .isort.cfg or setup.cfg files.
known-first-party = ["docpipe"]

[tool.ruff.format]
# Quote style standardization: Converting all string quotes to double quotes for consistency
# This will automatically convert single quotes to double quotes throughout the codebase
# Note: Raw strings (r"..."), f-strings (f"..."), and docstrings are handled correctly
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false

[tool.mypy]
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
# Treat the backend directory as the source root
files = ["."]
# Set Python version to 3.12 to support PEP 695 type parameter syntax
python_version = "3.12"
# Disable import-untyped errors for third-party libraries without type stubs
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "data_processing",
    "data_processing.*",
    "nltk",
    "nltk.*",
    "fasttext",
    "fasttext.*",
    "langdetect",
    "langdetect.*",
    "dpk_enrichment",
    "dpk_enrichment.*",
    "dpk_doc_quality",
    "dpk_doc_quality.*",
    "dpk_readability",
    "dpk_readability.*",
    "dpk_ededup",
    "dpk_ededup.*",
    "dpk_doc_id",
    "dpk_doc_id.*",
    "msal",
    "msal.*",
    "psutil",
    "psutil.*",
    "cachetools",
    "cachetools.*",
    "google_auth_oauthlib",
    "google_auth_oauthlib.*",
    "babel",
    "babel.*",
    "babel.core",
    "babel.numbers",
    "datefinder",
    "datefinder.*",
    "retrieval_main",
    "ollama_nl_to_sql_converter",
    "opensearch_sql",
    "result_combiner",
    "re2",
    "re2.*"
]
ignore_missing_imports = true
follow_imports = "silent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "types-boto3==1.43.0",
    "types-python-dateutil==2.9.0.20260408",
    "types-requests==2.33.0.20260408",
]


