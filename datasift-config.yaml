assets_management:
  flow_repository:
    type: local
    config:
      # Set this to the directory where your flow definitions are stored (flow repository).
      base_dir: sample_flows

job_management:
  framework:
    type: default
    config: {}
  store:
    # Storage backend options: inmemory, json, postgresql
    type: json
    config:
      base_dir: ./data/job_stats_store_data
