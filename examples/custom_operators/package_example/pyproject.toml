[project]
name = "my-custom-operators"
version = "0.1.0"
description = "Example custom operators package for Docpipe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docpipe>=0.1.0",
]

[project.entry-points."docpipe.operators"]
uppercase_text = "my_custom_operators.operators.uppercase_operator:UppercaseOperator"
reverse_text = "my_custom_operators.operators.reverse_operator:ReverseOperator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_custom_operators"]