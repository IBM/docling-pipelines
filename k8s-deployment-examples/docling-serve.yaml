# Docling Serve - Document Processing Service (Optional)
# Provides document extraction and conversion capabilities
# Only needed if using ExtractDocling operator
# Requires Redis for distributed task processing

# Redis PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: datasift
  labels:
    app: datasift
    component: redis
spec:
  accessModes:
    - ReadWriteOnce
  # CUSTOMIZE: Change storage class based on your cluster
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: datasift
  labels:
    app: datasift
    component: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  type: ClusterIP

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: datasift
  labels:
    app: datasift
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - "noeviction"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data

---
# Docling Serve Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve
  namespace: datasift
  labels:
    app: datasift
    component: docling-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-serve
  template:
    metadata:
      labels:
        app: docling-serve
    spec:
      containers:
      - name: docling-serve
        # CUSTOMIZE: Use CPU or GPU image based on your cluster
        # CPU: ghcr.io/docling-project/docling-serve-cpu:latest
        # GPU: ghcr.io/docling-project/docling-serve-gpu:latest
        image: ghcr.io/docling-project/docling-serve-cpu:latest
        ports:
        - containerPort: 5001
          name: http
        env:
        # CUSTOMIZE: Adjust number of workers based on CPU cores
        - name: DOCLING_WORKERS
          value: "2"
        - name: DOCLING_LOG_LEVEL
          value: "INFO"
        # Use RQ (Redis Queue) engine for distributed task processing
        # This prevents 404 "Task not found" errors with multiple pods
        - name: DOCLING_SERVE_ENG_KIND
          value: "rq"
        - name: DOCLING_SERVE_ENG_RQ_REDIS_URL
          value: "redis://redis:6379/0"
        # Legacy env vars (kept for compatibility)
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "5Gi"
            cpu: "3000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 5

---
# Docling Serve Service
apiVersion: v1
kind: Service
metadata:
  name: docling-serve
  namespace: datasift
  labels:
    app: datasift
    component: docling-serve
spec:
  selector:
    app: docling-serve
  ports:
  - port: 5001
    targetPort: 5001
    protocol: TCP
    name: http
  type: ClusterIP

