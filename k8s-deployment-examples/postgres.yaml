# PostgreSQL StatefulSet
# Provides persistent database storage for Prefect Server
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: datasift
  labels:
    app: datasift
    component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          env:
            # IMPORTANT: Change these credentials in production!
            # Consider using Kubernetes Secrets instead of plain text
            - name: POSTGRES_USER
              value: "prefect"
            - name: POSTGRES_PASSWORD
              value: "prefect123"
            - name: POSTGRES_DB
              value: "prefect"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Health checks ensure database is ready before accepting connections
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - prefect
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - prefect
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
  # Persistent storage for database data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
        labels:
          app: datasift
          component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        # CUSTOMIZE: Change storage class based on your cluster
        # Common options: local-path (k3s), standard (GKE), gp2 (EKS)
        storageClassName: "local-path"
        resources:
          requests:
            # CUSTOMIZE: Adjust storage size based on your needs
            storage: 10Gi

---
# PostgreSQL Service
# Provides stable DNS name for database access
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: datasift
  labels:
    app: datasift
    component: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  clusterIP: None  # Headless service for StatefulSet
  type: ClusterIP

