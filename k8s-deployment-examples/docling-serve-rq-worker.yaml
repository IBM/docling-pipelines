apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve-rq-worker
  namespace: datasift
  labels:
    app: docling-serve-rq-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docling-serve-rq-worker
  template:
    metadata:
      labels:
        app: docling-serve-rq-worker
    spec:
      terminationGracePeriodSeconds: 300
      containers:
      - name: docling-serve-rq-worker
        # Use CPU or GPU image based on your cluster capabilities
        # CPU: ghcr.io/docling-project/docling-serve-cpu:latest
        # GPU: ghcr.io/docling-project/docling-serve-gpu:latest
        image: ghcr.io/docling-project/docling-serve-cpu:latest
        command: ["docling-serve"]
        args: ["rq-worker"]
        env:
        - name: DOCLING_WORKERS
          value: "2"
        - name: DOCLING_LOG_LEVEL
          value: "INFO"
        - name: DOCLING_SERVE_ENG_KIND
          value: "rq"
        - name: DOCLING_SERVE_ENG_RQ_REDIS_URL
          value: "redis://redis:6379/0"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "6Gi"
            cpu: "3000m"
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 60"]
