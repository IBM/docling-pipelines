# Service Account for Prefect Workers
# This identity is used by worker pods to authenticate with Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prefect-worker
  namespace: datasift
  labels:
    app: datasift
    component: prefect-worker

---
# ClusterRole: Defines cluster-wide permissions for Job and Pod management
# Workers need these permissions to create and monitor Kubernetes Jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prefect-worker-clusterrole
  labels:
    app: datasift
    component: prefect-worker
rules:
  # Job permissions - workers create Jobs for each batch
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Pod permissions - workers monitor job pods for status
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  
  # Pod logs - workers stream logs for debugging
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  
  # Events - workers read events for job status updates
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  
  # Secrets - if workers need to access secrets for credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
# ClusterRoleBinding: Attaches the cluster role to the service account
# This grants the prefect-worker service account cluster-wide permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prefect-worker-clusterrolebinding
  labels:
    app: datasift
    component: prefect-worker
subjects:
  - kind: ServiceAccount
    name: prefect-worker
    namespace: datasift
roleRef:
  kind: ClusterRole
  name: prefect-worker-clusterrole
  apiGroup: rbac.authorization.k8s.io

