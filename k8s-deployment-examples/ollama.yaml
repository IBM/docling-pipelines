# Ollama - Local LLM Server (Optional)
# Provides LLM capabilities for entity extraction and embeddings
# Only needed if using ExtractEntitiesOllama or EmbeddingsOperator with Ollama models

# PersistentVolumeClaim for Ollama models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: datasift
  labels:
    app: datasift
    component: ollama
spec:
  accessModes:
    - ReadWriteOnce
  # CUSTOMIZE: Change storage class based on your cluster
  storageClassName: local-path
  resources:
    requests:
      # CUSTOMIZE: Adjust based on number and size of models
      # Each model can be 2-10GB (e.g., llama3.2: 2GB, granite4: 3GB)
      storage: 20Gi

---
# Ollama Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: datasift
  labels:
    app: datasift
    component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_ORIGINS
          value: "*"
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        resources:
          requests:
            # CUSTOMIZE: Adjust based on model size and workload
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "6Gi"
            cpu: "3000m"
        livenessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 5
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models

---
# Ollama Service
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: datasift
  labels:
    app: datasift
    component: ollama
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
    protocol: TCP
    name: http
  type: ClusterIP

---
