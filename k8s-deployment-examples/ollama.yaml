---
# Job to pull required models after Ollama starts
# CUSTOMIZE: Modify the models list based on your needs
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-setup
  namespace: datasift
  labels:
    app: datasift
    component: ollama-setup
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: ollama-setup
    spec:
      restartPolicy: OnFailure
      containers:
      - name: model-puller
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for Ollama service to be ready..."
          until curl -f http://ollama:11434/api/tags; do
            echo "Ollama not ready, waiting..."
            sleep 5
          done
          
          # CUSTOMIZE: Add or remove models based on your needs
          # Common models:
          # - llama3.2: General purpose LLM (2GB)
          # - granite4: IBM's embedding model (3GB)
          # - nomic-embed-text: Embedding model (274MB)
          
          echo "Pulling llama3.2 model for entity extraction..."
          curl -X POST http://ollama:11434/api/pull \
            -H "Content-Type: application/json" \
            -d '{"name": "llama3.2"}' \
            --max-time 1800
          
          echo "Pulling granite4 model for embeddings..."
          curl -X POST http://ollama:11434/api/pull \
            -H "Content-Type: application/json" \
            -d '{"name": "granite4"}' \
            --max-time 1800
          
          echo "Models pulled successfully"
          curl http://ollama:11434/api/tags
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
