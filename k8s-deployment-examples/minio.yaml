---
# Job to create MinIO bucket on startup
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: datasift
  labels:
    app: datasift
    component: minio-setup
spec:
  template:
    metadata:
      labels:
        app: minio-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              # Wait for MinIO to be ready
              until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
                echo "Waiting for MinIO..."
                sleep 5
              done
              
              # Create bucket if it doesn't exist
              mc mb myminio/datasift-batches --ignore-existing
              
              # Set bucket policy to allow read/write
              mc anonymous set download myminio/datasift-batches
              
              echo "MinIO setup complete!"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

