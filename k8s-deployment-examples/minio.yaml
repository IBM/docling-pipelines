# MinIO - S3-Compatible Object Storage (Optional)
# Used for batch data transfer between CLI and workers
# Only needed if using distributed execution with batch storage

# PersistentVolumeClaim for MinIO data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-storage
  namespace: datasift
  labels:
    app: datasift
    component: minio
spec:
  accessModes:
    - ReadWriteOnce
  # CUSTOMIZE: Change storage class based on your cluster
  storageClassName: local-path
  resources:
    requests:
      # CUSTOMIZE: Adjust storage size based on your data volume
      storage: 20Gi

---
# MinIO Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: datasift
  labels:
    app: datasift
    component: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        component: storage
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
              protocol: TCP
            - containerPort: 9001
              name: console
              protocol: TCP
          env:
            # IMPORTANT: Change these credentials in production!
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin"
            
            # Optional: Region
            - name: MINIO_REGION
              value: "us-east-1"
          
          volumeMounts:
            - name: minio-storage
              mountPath: /data
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-storage

---
# MinIO Service
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: datasift
  labels:
    app: datasift
    component: minio
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: api
    - port: 9001
      targetPort: 9001
      protocol: TCP
      name: console
  type: ClusterIP

---
