# Prefect Worker Deployment
# Workers poll the work pool and create Kubernetes Jobs for each batch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-worker
  namespace: datasift
  labels:
    app: datasift
    component: prefect-worker
spec:
  # CUSTOMIZE: Adjust number of workers based on workload
  # More workers = more parallel batch processing
  replicas: 2
  selector:
    matchLabels:
      app: prefect-worker
  template:
    metadata:
      labels:
        app: prefect-worker
        component: worker
    spec:
      # CRITICAL: Use the service account with RBAC permissions
      serviceAccountName: prefect-worker
      
      # Init container ensures work pool exists before workers start
      initContainers:
        - name: work-pool-setup
          image: prefecthq/prefect:3-python3.12-kubernetes
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for Prefect Server..."
              until python3 -c "import urllib.request; urllib.request.urlopen('http://prefect-server:4200/api/health', timeout=5)" 2>/dev/null; do
                echo "Server not ready, waiting 5s..."
                sleep 5
              done
              
              echo "Server is ready!"
              echo "Creating Kubernetes work pool..."
              prefect work-pool create datasift-k8s-pool --type kubernetes --overwrite
              
              echo "Work pool created successfully!"
              prefect work-pool ls
          env:
            - name: PREFECT_API_URL
              value: "http://prefect-server:4200/api"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      
      containers:
        - name: worker
          image: prefecthq/prefect:3-python3.12-kubernetes
          command:
            - prefect
            - worker
            - start
            - --pool
            - datasift-k8s-pool  # Must match work pool name
            - --type
            - kubernetes
            - --limit
            - "10"  # Max 10 concurrent jobs per worker
          
          env:
            # Prefect Server API URL
            - name: PREFECT_API_URL
              value: "http://prefect-server:4200/api"
            
            # Kubernetes cluster UID for job tracking
            - name: PREFECT_KUBERNETES_CLUSTER_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            
            # Worker name (unique per pod)
            - name: PREFECT_WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            
            # Optional: Logging level
            - name: PREFECT_LOGGING_LEVEL
              value: "INFO"
            
            # Optional: Worker query interval (seconds)
            - name: PREFECT_WORKER_QUERY_SECONDS
              value: "5"
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

