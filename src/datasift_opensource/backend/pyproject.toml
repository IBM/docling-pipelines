    "ftfy==6.3.1",
    "unicategories==0.1.2",
    "unicodedataplus==16.0.0",
    "datatrove==0.3.0",
    "nltk==3.9.3",
    "langchain-community==0.4.1",
    "langchain-google-community==3.0.5",
