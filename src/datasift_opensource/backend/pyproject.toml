    "docling[vlm]",
    "pyarrow==17.0.0",
    "urllib3==2.6.3",
    "botocore==1.42.55",
    "data-prep-toolkit-transforms==1.1.7",
    "filelock==3.20.3",
    "ibm-cos-sdk==2.14.3",
    "langdetect==1.0.9",
    "langchain==1.2.13",
    "langchain-classic==1.0.3",
    "langchain-core==1.2.27",
    "langchain-text-splitters==1.1.1",
