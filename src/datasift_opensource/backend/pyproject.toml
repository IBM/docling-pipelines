[project]
name = "datasift-opensource"
version = "0.1.0"
description = "This repository contains the datasift operators."
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.5",
    "python-dotenv==1.2.1",
    "pyyaml==6.0.3",
    "fastapi==0.128.8",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "docling[vlm]",
    "pyarrow==17.0.0",
    "urllib3==2.6.3",
    "botocore==1.38.18",
    "data-prep-toolkit-transforms==1.1.4.post1",
    "filelock==3.20.3",
    "ibm-cos-sdk==2.14.3",
    "langdetect==1.0.9",
    "langchain==1.2.10",
    "langchain-core==1.2.11",
    "prefect==3.4.23",
    "pyiceberg[glue]==0.9.1",
    "pyiceberg-core==0.7.0",
    "sqlglot==27.13.2",
    "tabulate==0.9.0",
    "toml==0.10.2",
    "pillow==12.1.1",
    "mlx==0.30.6",
    "orjson==3.11.7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "black==26.1.0",
    "flake8==7.3.0",
    "mypy==1.19.1",
    "httpx==0.28.1",  # For testing FastAPI
]

[project.scripts]
datasift-api = "datasift_opensource.app.main:app"
datasift-orchestrator = "datasift_opensource.orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datasift_opensource"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
