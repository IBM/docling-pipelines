    "mypy==1.19.1",
    "httpx==0.28.1",  # For testing FastAPI
    "detect-secrets==1.5.0",
    "pre-commit==4.5.1",
    "ruff==0.15.5",
    "openai>=1.0.0",
    "sentence-transformers>=2.2.0",
    "litellm>=1.0.0",
    "ibm-watsonx-ai>=0.1.0",
]
