assets_management:
  flow_repository:
    type: local
    config:
      # Set this to the directory where your flow definitions are stored (flow repository).
      base_dir: sample_flows

job_management:
  framework:
    type: default
    config: {}
  store:
    # Storage backend options: inmemory, json, duckdb, postgresql
    # Current active: json (file-based storage)
    type: filesystem
    config:
      base_dir: ./data/job_stats_store_data


incremental_metadata:
  storage:
    type: "filesystem"
    config:
      base_dir: "./data"
      lock_timeout: 30.0

