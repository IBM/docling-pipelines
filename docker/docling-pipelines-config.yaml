assets_management:
  flow_repository:
    type: local
    config:
      base_dir: /data/flows

  documentset_repository:
    type: duckdb
    config:
      database_path: /data/duckdb/document_sets.duckdb

  documentlibrary_repository:
    type: duckdb
    config:
      database_path: /data/duckdb/document_sets.duckdb

projects_management:
  project_repository:
    type: local
    config:
      base_dir: /data/projects

job_management:
  framework:
    type: default
    config: {}
  store:
    type: duckdb
    config:
      database_path: /data/duckdb/job_stats.duckdb

job_run_report:
  storage:
    type: filesystem
    config: {}

incremental_metadata:
  storage:
    type: filesystem
    config:
      base_dir: /data
      lock_timeout: 30.0

flow_definition_snapshot:
  storage:
    type: filesystem
    config:
      base_dir: /data
      lock_timeout: 30.0
