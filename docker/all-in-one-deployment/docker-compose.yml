version: '3.8'

services:
  # ============================================================================
  # POSTGRESQL DATABASE
  # ============================================================================
  
  postgres:
    image: postgres:17-alpine
    container_name: datasift-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datasift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datasift_password}
      POSTGRES_DB: ${POSTGRES_DB:-datasift}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - datasift-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datasift}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # OLLAMA - LLM SERVICE
  # ============================================================================
  
  ollama:
    image: ollama/ollama:0.5.4
    container_name: datasift-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - datasift-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags 2>/dev/null | grep -q 'models' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 10
        ollama pull llama3.2 || echo "Failed to pull llama3.2"
        ollama pull nomic-embed-text || echo "Failed to pull nomic-embed-text"
        wait

  # ============================================================================
  # OPENSEARCH - VECTOR DATABASE
  # ============================================================================
  
  opensearch:
    image: opensearchproject/opensearch:3.60.0
    container_name: datasift-opensearch
    environment:
      - cluster.name=datasift-cluster
      - node.name=datasift-node
      - discovery.type=single-node
      - plugins.security.disabled=false
      - plugins.security.ssl.http.enabled=false
      - plugins.security.ssl.transport.enabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-MyStrongPass123!}
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_PERF_PORT:-9600}:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - datasift-net
    healthcheck:
      test: ["CMD-SHELL", "curl -u admin:${OPENSEARCH_PASSWORD:-MyStrongPass123!} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ============================================================================
  # DATASIFT APPLICATION
  # ============================================================================
  
  datasift:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: datasift-opensource:latest
    container_name: datasift-app
    user: "1000:1000"
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-datasift}:${POSTGRES_PASSWORD:-datasift_password}@postgres:5432/${POSTGRES_DB:-datasift}
      
      # Python Configuration
      PYTHONPATH: /opt/app-root/src
      
      # External Services
      OLLAMA_HOST: http://ollama:11434
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-MyStrongPass123!}
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_VERIFY_CERTS: "false"
      
      # Application Configuration
      DATASIFT_DATA_PATH: /opt/app-root/src/data
    ports:
      - "${DATASIFT_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      opensearch:
        condition: service_healthy
    networks:
      - datasift-net
    volumes:
      - ./data:/opt/app-root/src/data:rw
      - ./logs:/opt/app-root/src/logs:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  ollama-data:
    driver: local
  opensearch-data:
    driver: local

networks:
  datasift-net:
    driver: bridge
    name: datasift-net
