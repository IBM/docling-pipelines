services:
  # ============================================================================
  # POSTGRESQL DATABASE
  # ============================================================================

  postgres:
    image: postgres:17-alpine
    container_name: docpipe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docpipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docpipe_password}
      POSTGRES_DB: ${POSTGRES_DB:-docpipe}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - docpipe-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docpipe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # OLLAMA - LLM SERVICE
  # ============================================================================

  ollama:
    image: ollama/ollama:0.5.4
    container_name: docpipe-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags 2>/dev/null | grep -q 'models' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 10
        ollama pull llama3.2 || echo "Failed to pull llama3.2"
        ollama pull nomic-embed-text || echo "Failed to pull nomic-embed-text"
        wait

  # ============================================================================
  # OPENSEARCH - VECTOR DATABASE
  # ============================================================================

  opensearch:
    image: opensearchproject/opensearch:3.60.0
    container_name: docpipe-opensearch
    environment:
      - cluster.name=docpipe-cluster
      - node.name=docpipe-node
      - discovery.type=single-node
      - plugins.security.disabled=false
      - plugins.security.ssl.http.enabled=false
      - plugins.security.ssl.transport.enabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-MyStrongPass123!}
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_PERF_PORT:-9600}:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD-SHELL", "curl -u admin:${OPENSEARCH_PASSWORD:-MyStrongPass123!} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ============================================================================
  # DOCPIPE APPLICATION
  # ============================================================================

  # ============================================================================
  # BFF — Node/Express Backend-for-Frontend
  # ============================================================================

  bff:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.bff
    image: docling-pipelines-bff:latest
    container_name: docpipe-bff
    environment:
      # Points to the docpipe FastAPI container on the shared network.
      # No depends_on here — the BFF is resilient to FastAPI not being
      # ready yet (Express starts in ~1 s; FastAPI takes much longer).
      BACKEND_API_URL: "http://docpipe:8080"
      BFF_PORT: "3001"
    # No external port binding — the BFF is an internal routing layer only.
    # All external traffic enters via the docpipe service on port 8080.
    # FastAPI proxies /api/* internally to http://bff:3001 on docpipe-net.
    expose:
      - "3001"
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ============================================================================
  # DOCPIPE APPLICATION
  # ============================================================================

  docpipe:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: docling-pipelines:latest
    container_name: docpipe-app
    user: "1000:1000"
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-docpipe}:${POSTGRES_PASSWORD:-docpipe_password}@postgres:5432/${POSTGRES_DB:-docpipe}

      # Python Configuration
      PYTHONPATH: /opt/app-root/src

      # BFF Configuration — tells FastAPI where the BFF container is.
      # _start_bff() skips the Popen sidecar when this is already set.
      BFF_URL: "http://bff:3001"
      FASTAPI_PORT: "8080"

      # External Services
      OLLAMA_HOST: http://ollama:11434
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-MyStrongPass123!}
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_VERIFY_CERTS: "false"

      # Application Configuration
      DOCPIPE_DATA_PATH: /opt/app-root/src/data
    ports:
      - "${DOCPIPE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      opensearch:
        condition: service_healthy
      # BFF must be accepting connections before FastAPI starts proxying /api/*
      # to it. The BFF has no depends_on on docpipe to avoid a circular
      # dependency — it simply retries failed upstream calls at the app level.
      bff:
        condition: service_healthy
    networks:
      - docpipe-net
    volumes:
      - ../../data:/opt/app-root/src/data:rw
      - ../../logs:/opt/app-root/src/logs:rw
      - ../../sample_flows:/opt/app-root/src/sample_flows:rw
      - ../../sample_projects:/opt/app-root/src/sample_projects:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  ollama-data:
    driver: local
  opensearch-data:
    driver: local

networks:
  docpipe-net:
    driver: bridge
    name: docpipe-net
