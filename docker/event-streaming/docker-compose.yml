  ollama:
    image: ollama/ollama:0.34.1
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      plugins.security.ssl.http.enabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error -u \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" --output /dev/null http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  docpipe:
    build:
      context: ../..
      dockerfile: docker/event-streaming/Dockerfile
      args:
        COMPUTE_BACKEND: cpu
    ports:
      - "8080:8080"
    environment:
      FLOW_REPOSITORY_BASE_DIR: /data/flows
      HF_HOME: /data/models/huggingface
      OLLAMA_HOST: http://ollama:11434
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
    volumes:
      - ../../tests/fixtures/invoices:/documents:ro
    depends_on:
      ollama:
        condition: service_started
      opensearch:
        condition: service_healthy

volumes:
  docpipe-data:
  ollama-data:
  opensearch-data:
