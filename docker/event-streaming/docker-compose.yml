services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:?Set KAFKA_TOPIC before starting Compose}
    volumes:
      - ./scripts/kafka-init.sh:/kafka-init.sh:ro
    entrypoint: ["/bin/sh", "/kafka-init.sh"]
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.4
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy

  register-schema:
    image: python:3.12-slim
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:?Set KAFKA_TOPIC before starting Compose}
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./register_schema.py:/app/register_schema.py:ro
      - ./schemas:/app/schemas:ro
    command:
      - python
      - /app/register_schema.py
      - --schema-files
      - event_schema.json
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
