version: '3.8'

services:
  # ============================================================================
  # PREFECT INFRASTRUCTURE
  # ============================================================================

  prefect-postgres:
    image: postgres:15-alpine
    container_name: prefect-postgres
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prefect
    volumes:
      - prefect-postgres-data:/var/lib/postgresql/data
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${POSTGRES_PASSWORD}@prefect-postgres:5432/prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_API_URL: http://localhost:4200/api
    ports:
      - "4200:4200"
    depends_on:
      prefect-postgres:
        condition: service_healthy
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ============================================================================
  # PREFECT WORKERS (Docpipe Image)
  # ============================================================================

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: docling-pipelines:latest
    user: root  # Required for Docker socket access
    command: |
      sh -c "sleep 30 && prefect work-pool create docpipe-pool --type docker || true &&
             prefect worker start --pool docpipe-pool --limit 10 --with-healthcheck"
    environment:
      # Prefect Configuration
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_MODE: server
      PYTHONPATH: /app/src/docpipe_app/backend

      # Docker Configuration for Docker Work Pool
      DOCKER_HOST: unix:///var/run/docker.sock

      # Image pull policy: never pull, use local images only
      PREFECT__DOCKER__IMAGE_PULL_POLICY: Never

      # Job Stats Configuration (POC: using local pickle files)
      JOB_STATS_BACKEND: pickle

      # MinIO/S3 Configuration for Batch Storage
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: us-east-1

      # External Services
      OLLAMA_HOST: http://ollama:11434
      DOCLING_SERVE_URL: http://docling-serve:5001
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_VERIFY_CERTS: "false"
    depends_on:
      prefect-server:
        condition: service_started
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
      opensearch:
        condition: service_started
      docling-serve:
        condition: service_started
    networks:
      - docpipe-net
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for running containers
    restart: unless-stopped
    deploy:
      replicas: 4  # 4 workers for POC

  # ============================================================================
  # MINIO - S3-Compatible Object Storage for Batch Data
  # ============================================================================

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/docpipe-batches --ignore-existing;
      mc anonymous set download myminio/docpipe-batches;
      echo 'MinIO bucket created: docpipe-batches';
      "
    networks:
      - docpipe-net

  # ============================================================================
  # EXTERNAL SERVICES
  # ============================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags 2>/dev/null | grep -q 'models' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 10
        ollama pull llama3.2
        ollama pull nomic-embed-text
        ollama pull granite4
        wait

  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    container_name: docling-serve
    ports:
      - "5001:5001"
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - plugins.security.disabled=false
      - plugins.security.ssl.http.enabled=false
      - plugins.security.ssl.transport.enabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD-SHELL", "curl -u admin:${OPENSEARCH_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - docpipe-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u admin:${OPENSEARCH_PASSWORD} http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  prefect-postgres-data:
  minio-data:
  ollama-data:
  opensearch-data:

networks:
  docpipe-net:
    driver: bridge
    name: docpipe-net
