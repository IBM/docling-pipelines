schema: spec-driven

context: |
  Monorepo: Python backend (src/docpipe/) + React frontend (frontend/src/)

  Backend: Python 3.12, FastAPI, pyarrow, DuckDB/Postgres, docling
  - Package: docpipe | source root: src/ | Python >=3.12,<3.13
  - REST API: FastAPI app at src/docpipe/api/main.py
  - Routes: src/docpipe/api/routes/ (flows, projects, job_runs, operators, validation, document_sets, document_libraries, documents, providers)
  - Core engine: src/docpipe/core/ — operators, orchestration, job_management, assets, adapters
  - Operators extend AbstractOperator; registered in DOCPIPE_OPERATORS frozenset in src/docpipe/core/operators/operator_registry.py
  - 21 built-in operators across categories: Ingest, Extract, Functional, Quality, VectorDB, Storage
  - Storage: DuckDB (default) or Postgres; abstracted via TableStorage / KeyValueStorage interfaces
  - Orchestrators: PythonOrchestrator (default, in-process), PrefectEngine (distributed)
  - Inter-operator data is pyarrow Tables; transform() returns tuple[list[pa.Table], dict]
  - DDD layering in core/assets/ and core/job_management/: domain/ -> application/ -> adapters/
  - LLM adapters in src/docpipe/core/adapters/; accessed via port interfaces only (LLMInferencePort, LLMEmbeddingPort)
  - Logging: always use get_logger() from docpipe.utils.infrastructure.logging; %s-style, no f-strings, no emoji
  - SessionInfo (job_id, job_run_id) is thread-local; access via get_session_info(), never pass as function args
  - Entrypoints: CLI (docpipe_cli.py), REST API (api/main.py), Python lib (DocpipeFlowManager)

  Frontend: TypeScript 5, React 18, Vite 6, Redux Toolkit 2, Elyra Canvas 13, Carbon React 1
  - Source root: frontend/src/
  - Pages: frontend/src/pages/ (Canvas, FlowDetail, Home, ProjectDetail, Projects, RunDetails, Error, NotFound)
  - State management: Redux Toolkit slices in frontend/src/slices/ (flowSlice, projectsSlice, jobRunSlice, operatorsSlice, assetsSlice, notificationsSlice)
  - API services: frontend/src/services/api/
  - Elyra Canvas (@elyra/canvas) used for the interactive pipeline editor (canvas-page)
  - Carbon Design System (@carbon/react) for all UI components

  Spec namespace convention:
  - frontend/* — React page and component specs
  - backend/*  — Python API routes, core engine, and operator specs

  Spec naming convention (capability path suffixes):
  - Pages:                  <name>-page           (e.g. canvas-page, home-page)
  - Panels / flyouts:       <name>-panel          (e.g. properties-panel, run-side-panel)
  - Canvas components:      <name>-canvas         (e.g. elyra-canvas, read-only-canvas)
  - Operator config panels: <name>-panel          (e.g. ingest-source-panel, vectordb-panel)
  - Common UI components:   <name>                (e.g. shared-data-table, delete-modal — path under common/ is sufficient)
  - Redux slices:           <name>-slice          (e.g. flows-slice, projects-slice)
  - Backend APIs:           <name>-api            (e.g. flows-api, projects-api)
  - Core engine:            <name> under backend/ (e.g. backend/flow-execution-engine)

rules:
  proposal:
    - Always include a Non-goals section
    - State whether the change is frontend-only, backend-only, or full-stack
  tasks:
    - Break tasks into chunks of max 2 hours
    - "Tag each task with the layer it touches: [frontend], [backend], or [both]"
