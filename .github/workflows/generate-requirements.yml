name: Generate Requirements

on:
  push:
    branches:
      - main
    paths:
      - 'src/datasift_opensource/backend/pyproject.toml'
  pull_request:
    paths:
      - 'src/datasift_opensource/backend/pyproject.toml'
  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Export nested deps to root
        run: |
          uv export \
            --project ./src/datasift_opensource/backend \
            --format requirements-txt \
            --output-file requirements.txt \
            --no-dev \
            --frozen

      - name: Verify file location
        run: |
          echo "Checking root directory for requirements.txt:"
          ls -lh requirements.txt
          echo ""
          echo "First 20 lines of requirements.txt:"
          head -n 20 requirements.txt

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add requirements.txt
          if git diff --staged --quiet; then
            echo "No changes to requirements.txt"
          else
            git commit -m "chore: update requirements.txt from backend/pyproject.toml"
            git push
          fi