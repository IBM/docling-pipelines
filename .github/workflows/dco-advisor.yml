name: DCO Advisor Bot

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  checks: read
  pull-requests: write
  issues: write

jobs:
  dco_advisor:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Handle DCO check result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const headSha = context.payload.workflow_run.head_sha;

            console.log("HEAD SHA:", headSha);

            // Find the PR associated with the workflow run's commit.
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha
              });

            const pr = prs.find(candidate =>
              candidate.state === "open" &&
              candidate.base.ref === "main" &&
              candidate.base.repo.full_name ===
                `${context.repo.owner}/${context.repo.repo}` &&
              candidate.head.sha === headSha
            );

            if (!pr) {
              console.log(`No matching PR found for ${headSha}.`);
              return;
            }

            const prNumber = pr.number;
            const baseRef = pr.base.ref;
            const username = pr.user.login;

            console.log(`PR #${prNumber}: ${pr.title}`);
            console.log(`Base: ${baseRef}`);
            console.log(`Head: ${headSha}`);

            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            // Poll until DCO check has a conclusion (max 6 attempts, 30s)
            let dcoCheck = null;

            for (let attempt = 0; attempt < 6; attempt++) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha
              });

              console.log("All check runs:");
              checks.check_runs.forEach(run => {
                console.log(
                  `- ${run.name} (${run.status}/${run.conclusion}) @ ${run.head_sha}`
                );
              });

              dcoCheck = checks.check_runs.find(run =>
                run.name.toLowerCase().includes("dco") &&
                !run.name.toLowerCase().includes("dco advisor") &&
                run.head_sha === headSha
              );

              if (dcoCheck?.conclusion) {
                break;
              }

              console.log(`Waiting for DCO check... (${attempt + 1})`);
              await sleep(5000);
            }

            if (!dcoCheck || !dcoCheck.conclusion) {
              console.log("DCO check did not complete in time.");
              return;
            }

            const isFailure = ["failure", "action_required"].includes(
              dcoCheck.conclusion
            );

            console.log(
              `DCO check conclusion for ${headSha}: ${dcoCheck.conclusion} ` +
              `(treated as ${isFailure ? "failure" : "success"})`
            );

            // Parse commits missing sign-off.
            let badCommits = [];
            let authorName = "";
            let authorEmail = "";

            const moreInfo =
              `More info: [DCO check report](${dcoCheck.html_url})`;

            if (isFailure) {
              const { data: commits } = await github.rest.pulls.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              for (const commit of commits) {
                const commitMessage = commit.commit.message;
                const signoffMatch =
                  commitMessage.match(/^Signed-off-by:\s+.+<.+>$/m);

                if (!signoffMatch) {
                  console.log(`Bad commit found ${commit.sha}`);

                  badCommits.push({
                    sha: commit.sha,
                    authorName: commit.commit.author.name,
                    authorEmail: commit.commit.author.email,
                  });
                }
              }
            }

            if (badCommits.length > 0) {
              authorName = badCommits[0].authorName;
              authorEmail = badCommits[0].authorEmail;
            }

            let remediationSnippet = "";

            if (badCommits.length && authorEmail) {
              remediationSnippet =
                `git commit --allow-empty -s -m "DCO Remediation Commit for ` +
                `${authorName} <${authorEmail}>\n\n` +
                badCommits
                  .map(
                    c =>
                      `I, ${c.authorName} <${c.authorEmail}>, hereby add my ` +
                      `Signed-off-by to this commit: ${c.sha}`
                  )
                  .join("\n") +
                `"`;
            } else {
              remediationSnippet =
                "# Unable to auto-generate remediation message. " +
                "Please check the DCO check details.";
            }

            const commentHeader = "<!-- dco-advice-bot -->";
            let body = "";

            if (isFailure) {
              body = [
                commentHeader,
                "❌ **DCO Check Failed**",
                "",
                `Hi @${username}, your pull request has failed the Developer Certificate of Origin (DCO) check.`,
                "",
                "This repository supports **remediation commits**, so you can fix this without rewriting history — but you must follow the required message format.",
                "",
                "---",
                "",
                "### 🛠 Quick Fix: Add a remediation commit",
                "Run this command:",
                "",
                "```bash",
                remediationSnippet,
                "git push",
                "```",
                "",
                "---",
                "",
                "<details>",
                "<summary>🔧 Advanced: Sign off each commit directly</summary>",
                "",
                "**For the latest commit:**",
                "```bash",
                "git commit --amend --signoff",
                "git push --force-with-lease",
                "```",
                "",
                "**For multiple commits:**",
                "```bash",
                `git rebase --signoff origin/${baseRef}`,
                "git push --force-with-lease",
                "```",
                "",
                "</details>",
                "",
                moreInfo
              ].join("\n");
            } else {
              body = [
                commentHeader,
                "✅ **DCO Check Passed**",
                "",
                `Thanks @${username}, all your commits are properly signed off. 🎉`
              ].join("\n");
            }

            // Upsert bot comment on the PR.
            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

            const existingComment = comments.find(c =>
              c.body.includes(commentHeader)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
