name: Commit Verification (DCO + GPG + Template)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-commits:
    name: Verify DCO, GPG & PR Template
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Commits (DCO + GPG) & PR Template
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        id: verify
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;

            console.log("HEAD SHA:", headSha);

            // Find the PR associated with the workflow run's commit.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: headSha
            });

            const pr = prs.find(candidate =>
              candidate.state === "open" &&
              candidate.base.ref === "main" &&
              candidate.base.repo.full_name === `${owner}/${repo}` &&
              candidate.head.sha === headSha
            );

            if (!pr) {
              console.log(`No matching PR found for ${headSha}.`);
              core.setOutput('dco_failed', '[]');
              core.setOutput('gpg_failed', '[]');
              core.setOutput('template_failed', '[]');
              core.setOutput('dco_passed', '0');
              core.setOutput('gpg_passed', '0');
              core.setOutput('template_passed', '0');
              core.setOutput('all_passed', 'true');
              core.setOutput('pr_number', '0');
              core.setOutput('pr_author', '');
              core.setOutput('base_ref', 'main');
              return;
            }

            const prNumber = pr.number;
            const prAuthor = pr.user.login;
            const baseRef = pr.base.ref;

            // Get PR body for template validation
            const { data: prDetails } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            const prBody = prDetails.body || '';

            // Get all commits in the PR (handle pagination, max 250 per GitHub API)
            let allCommits = [];
            let page = 1;
            const perPage = 100;
            const maxCommits = 250;

            while (true) {
              const { data: commits } = await github.rest.pulls.listCommits({
                owner,
                repo,
                pull_number: prNumber,
                per_page: perPage,
                page: page
              });

              if (commits.length === 0) break;
              allCommits = allCommits.concat(commits);
              if (allCommits.length >= maxCommits) {
                allCommits = allCommits.slice(0, maxCommits);
                break;
              }
              if (commits.length < perPage) break;
              page++;
            }

            // Edge case: PR with zero commits - treat as pass (nothing to validate)
            if (allCommits.length === 0) {
              console.log('No commits found in PR');
              core.setOutput('dco_failed', '[]');
              core.setOutput('gpg_failed', '[]');
              core.setOutput('template_failed', '[]');
              core.setOutput('dco_passed', '0');
              core.setOutput('gpg_passed', '0');
              core.setOutput('template_passed', '0');
              core.setOutput('all_passed', 'true');
              core.setOutput('pr_number', String(prNumber));
              core.setOutput('pr_author', prAuthor);
              core.setOutput('base_ref', baseRef);
              return;
            }

            const results = {
              dco: { passed: [], failed: [] },
              gpg: { passed: [], failed: [] },
              template: { passed: [], failed: [] }
            };

            // Check DCO and GPG for each commit (skip merge commits)
            for (const commit of allCommits) {
              // Skip merge commits (have >1 parent) — they don't need DCO sign-off
              if (commit.parents && commit.parents.length > 1) {
                console.log(`Skipping merge commit ${commit.sha}`);
                continue;
              }

              const sha = commit.sha;
              const message = commit.commit.message;
              const verification = commit.commit.verification;
              const author = commit.commit.author.name;
              const email = commit.commit.author.email;
              const shortMsg = message.split('\n')[0];

              // DCO: Signed-off-by trailer
              // Matches: Signed-off-by: Name <email> (requires non-empty email; git commit -s always includes one)
              const hasSignoff = /^Signed-off-by:\s+.+<.+>$/m.test(message);
              if (hasSignoff) {
                results.dco.passed.push(sha);
              } else {
                results.dco.failed.push({ sha, author, email, message: shortMsg });
              }

              // GPG: GitHub's commit verification
              if (verification?.verified === true) {
                results.gpg.passed.push(sha);
              } else {
                results.gpg.failed.push({
                  sha,
                  author,
                  email,
                  message: shortMsg,
                  reason: verification?.reason || 'unsigned',
                  verified: verification?.verified || false
                });
              }
            }

            // PR Template validation
            const requiredSections = [
              '## Issue',
              '## Description',
              '## Basic Checklist',
              '### Pre-Commit Hook Results'
            ];

            for (const section of requiredSections) {
              if (prBody.includes(section)) {
                results.template.passed.push(section);
              } else {
                results.template.failed.push(section);
              }
            }

            // Warn if pre-commit results section appears empty or has only placeholder
            const preCommitMatch = prBody.match(/### Pre-Commit Hook Results[\s\S]*?(?=###|##|$)/);
            if (preCommitMatch) {
              const content = preCommitMatch[0].replace(/### Pre-Commit Hook Results/, '').trim();
              // Consider empty if less than 10 chars or only the placeholder comment
              if (!content || content.length < 10 || content === '<!-- Paste the output of pre-commit hooks execution to verify all checks passed -->') {
                results.template.failed.push('### Pre-Commit Hook Results (empty)');
              }
            }

            // Output summary
            const dcoFailCount = results.dco.failed.length;
            const gpgFailCount = results.gpg.failed.length;
            const templateFailCount = results.template.failed.length;
            const allPassed = dcoFailCount === 0 && gpgFailCount === 0 && templateFailCount === 0;

            console.log(`DCO: ${results.dco.passed.length} passed, ${dcoFailCount} failed`);
            console.log(`GPG: ${results.gpg.passed.length} passed, ${gpgFailCount} failed`);
            console.log(`Template: ${results.template.passed.length} passed, ${templateFailCount} failed`);

            if (dcoFailCount > 0) {
              console.log('DCO Failed:', JSON.stringify(results.dco.failed, null, 2));
            }
            if (gpgFailCount > 0) {
              console.log('GPG Failed:', JSON.stringify(results.gpg.failed, null, 2));
            }
            if (templateFailCount > 0) {
              console.log('Template Failed:', JSON.stringify(results.template.failed, null, 2));
            }

            // Set outputs
            core.setOutput('dco_failed', JSON.stringify(results.dco.failed));
            core.setOutput('gpg_failed', JSON.stringify(results.gpg.failed));
            core.setOutput('template_failed', JSON.stringify(results.template.failed));
            core.setOutput('dco_passed', String(results.dco.passed.length));
            core.setOutput('gpg_passed', String(results.gpg.passed.length));
            core.setOutput('template_passed', String(results.template.passed.length));
            core.setOutput('all_passed', String(allPassed));
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('pr_author', prAuthor);
            core.setOutput('base_ref', baseRef);

      - name: Post Verification Comment
        if: always() && steps.verify.outcome != 'cancelled'
        env:
          DCO_FAILED: ${{ steps.verify.outputs.dco_failed }}
          GPG_FAILED: ${{ steps.verify.outputs.gpg_failed }}
          TEMPLATE_FAILED: ${{ steps.verify.outputs.template_failed }}
          DCO_PASSED: ${{ steps.verify.outputs.dco_passed }}
          GPG_PASSED: ${{ steps.verify.outputs.gpg_passed }}
          TEMPLATE_PASSED: ${{ steps.verify.outputs.template_passed }}
          ALL_PASSED: ${{ steps.verify.outputs.all_passed }}
          PR_NUMBER: ${{ steps.verify.outputs.pr_number }}
          PR_AUTHOR: ${{ steps.verify.outputs.pr_author }}
          BASE_REF: ${{ steps.verify.outputs.base_ref }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = parseInt(process.env.PR_NUMBER || '0', 10);

            if (prNumber === 0) {
              console.log('No PR to comment on');
              return;
            }

            // Safely parse env vars (they come from previous step outputs)
            let dcoFailed, gpgFailed, templateFailed;
            try {
              dcoFailed = JSON.parse(process.env.DCO_FAILED || '[]');
              gpgFailed = JSON.parse(process.env.GPG_FAILED || '[]');
              templateFailed = JSON.parse(process.env.TEMPLATE_FAILED || '[]');
            } catch (e) {
              console.error('Failed to parse step outputs:', e);
              // Post error comment and exit
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: '<!-- commit-verification-bot -->\n❌ **Workflow Error**\n\nUnable to read verification results. Please re-run the workflow.'
              });
              core.setFailed('JSON parse error');
              return;
            }

            const dcoPassed = parseInt(process.env.DCO_PASSED || '0', 10);
            const gpgPassed = parseInt(process.env.GPG_PASSED || '0', 10);
            const templatePassed = parseInt(process.env.TEMPLATE_PASSED || '0', 10);
            const allPassed = process.env.ALL_PASSED === 'true';
            const prAuthor = process.env.PR_AUTHOR || '';
            const baseRef = process.env.BASE_REF || 'main';

            // Sanitize user-provided values for markdown table safety
            function sanitizeForTable(str) {
              return String(str)
                .replace(/\|/g, '\\|')  // Escape pipes
                .replace(/\n/g, ' ')    // Replace newlines with spaces
                .replace(/\r/g, '')     // Remove carriage returns
                .slice(0, 100);         // Truncate long messages
            }

            const commentHeader = "<!-- commit-verification-bot -->";

            let body = "";

            if (allPassed) {
              body = [
                commentHeader,
                "✅ **Commit Verification Passed**",
                "",
                `Thanks @${prAuthor}! All commits have valid DCO sign-off and GPG signatures, and the PR template is complete. 🎉`,
                "",
                "**Summary:**",
                `- DCO (Signed-off-by): ${dcoPassed} commit(s) ✅`,
                `- GPG Verification: ${gpgPassed} commit(s) ✅`,
                `- PR Template: ${templatePassed} required section(s) ✅`
              ].join("\n");
            } else {
              body = [
                commentHeader,
                "❌ **Commit Verification Failed**",
                "",
                `Hi @${prAuthor}, your pull request has validation failures that must be resolved before merging.`,
                "",
                "This repository requires **all three**:",
                "1. **DCO Sign-off** — Every commit must have a `Signed-off-by` trailer (`git commit -s`)",
                "2. **GPG Verification** — Every commit must be GPG-signed and show **Verified** on GitHub",
                "3. **PR Template** — All required sections must be filled out",
                "",
                "---"
              ].join("\n");

              if (dcoFailed.length > 0) {
                body += "\n### 📝 DCO Sign-off Failures (" + dcoFailed.length + " commit(s))\n";
                body += "These commits are missing `Signed-off-by`:\n\n";
                body += "| Commit | Author | Message |\n";
                body += "|--------|--------|---------|\n";
                for (const c of dcoFailed) {
                  body += `| \`${c.sha.slice(0,7)}\` | ${sanitizeForTable(c.author)} <${sanitizeForTable(c.email)}> | ${sanitizeForTable(c.message)} |\n`;
                }
                body += "\n**Quick Fix (no history rewrite):** Add a remediation commit:\n";
                body += "```bash\n";
                body += `git commit --allow-empty -s -m "DCO Remediation Commit for ${sanitizeForTable(dcoFailed[0].author)} <${sanitizeForTable(dcoFailed[0].email)}>\n\n`;
                for (const c of dcoFailed) {
                  body += `I, ${sanitizeForTable(c.author)} <${sanitizeForTable(c.email)}>, hereby add my Signed-off-by to this commit: ${c.sha}\n`;
                }
                body += '"\n';
                body += "git push\n```\n";
                body += "\n*Or sign each commit directly:* `git rebase --signoff origin/${baseRef} && git push --force-with-lease`\n";
              }

              if (gpgFailed.length > 0) {
                body += "\n### 🔐 GPG Verification Failures (" + gpgFailed.length + " commit(s))\n";
                body += "These commits are **not GPG-verified** on GitHub:\n\n";
                body += "| Commit | Author | Reason | Message |\n";
                body += "|--------|--------|--------|---------|\n";
                for (const c of gpgFailed) {
                  const reason = c.reason || 'unsigned';
                  body += `| \`${c.sha.slice(0,7)}\` | ${sanitizeForTable(c.author)} <${sanitizeForTable(c.email)}> | ${sanitizeForTable(reason)} | ${sanitizeForTable(c.message)} |\n`;
                }
                body += "\n**Fix:** You must GPG-sign all commits. See [Verified Commits setup guide](https://github.com/IBM/docling-pipelines/blob/main/CONTRIBUTING.md#verified-commits).\n\n";
                body += "**Single commit:**\n";
                body += "```bash\n";
                body += "git commit --amend --signoff -S\n";
                body += "git push --force-with-lease\n";
                body += "```\n\n";
                body += "**Multiple commits:**\n";
                body += "```bash\n";
                body += "git rebase --exec 'git commit --amend --signoff -S --no-edit' origin/${baseRef}\n";
                body += "git push --force-with-lease\n";
                body += "```\n\n";
                body += "> **Note:** GPG signing (`-S`) is separate from DCO sign-off (`-s`). **Both are required.**\n";
              }

              if (templateFailed.length > 0) {
                body += "\n### 📋 PR Template Validation Failures\n";
                body += "Missing or incomplete required section(s):\n\n";
                for (const section of templateFailed) {
                  body += `- \`${section}\`\n`;
                }
                body += "\nPlease fill out all sections of the PR template before requesting review.\n";
                body += "See the [PR template](.github/pull_request_template.md) for reference.\n";
              }

              body += "\n---\n";
              body += `**Summary:** DCO: ${dcoPassed} passed, ${dcoFailed.length} failed | GPG: ${gpgPassed} passed, ${gpgFailed.length} failed | Template: ${templatePassed} passed, ${templateFailed.length} failed`;
            }

            // Upsert bot comment (fetch all pages to find existing comment on busy PRs)
            let existingComment = null;
            let page = 1;
            const perPage = 100;

            while (true) {
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
                per_page: perPage,
                page: page
              });

              if (comments.length === 0) break;

              existingComment = comments.find(c => c.body.includes(commentHeader));
              if (existingComment) break;

              if (comments.length < perPage) break;
              page++;
            }

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

      - name: Fail Workflow if Verification Failed
        if: steps.verify.outputs.all_passed != 'true'
        run: |
          echo "::error::Commit verification failed - see bot comment for details"
          exit 1
