name: Commit Verification (DCO + GPG + Template)

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  verify-commits:
    name: Verify DCO, GPG & PR Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify All Commits (DCO + GPG) & PR Template
        uses: actions/github-script@v7
        id: verify
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;
            const baseRef = context.payload.pull_request.base.ref;
            const prBody = context.payload.pull_request.body || '';

            // Get all commits in the PR (handle pagination for >100 commits)
            let allCommits = [];
            let page = 1;
            const perPage = 100;

            while (true) {
              const { data: commits } = await github.rest.pulls.listCommits({
                owner,
                repo,
                pull_number: prNumber,
                per_page: perPage,
                page: page
              });

              if (commits.length === 0) break;
              allCommits = allCommits.concat(commits);
              if (commits.length < perPage) break;
              page++;
            }

            const results = {
              dco: { passed: [], failed: [] },
              gpg: { passed: [], failed: [] },
              template: { passed: [], failed: [] }
            };

            // Check DCO and GPG for each commit
            for (const commit of allCommits) {
              const sha = commit.sha;
              const message = commit.commit.message;
              const verification = commit.commit.verification;
              const author = commit.commit.author.name;
              const email = commit.commit.author.email;
              const shortMsg = message.split('\n')[0];

              // DCO: Signed-off-by trailer
              const hasSignoff = /^Signed-off-by:\s+.+<.+>$/m.test(message);
              if (hasSignoff) {
                results.dco.passed.push(sha);
              } else {
                results.dco.failed.push({ sha, author, email, message: shortMsg });
              }

              // GPG: GitHub's commit verification
              if (verification?.verified === true) {
                results.gpg.passed.push(sha);
              } else {
                results.gpg.failed.push({
                  sha,
                  author,
                  email,
                  message: shortMsg,
                  reason: verification?.reason || 'unsigned',
                  verified: verification?.verified || false
                });
              }
            }

            // PR Template validation
            const requiredSections = [
              '## Issue',
              '## Description',
              '## Basic Checklist',
              '### Pre-Commit Hook Results'
            ];

            for (const section of requiredSections) {
              if (prBody.includes(section)) {
                results.template.passed.push(section);
              } else {
                results.template.failed.push(section);
              }
            }

            // Warn if pre-commit results section appears empty
            const preCommitMatch = prBody.match(/### Pre-Commit Hook Results[\s\S]*?(?=###|##|$)/);
            if (preCommitMatch) {
              const content = preCommitMatch[0].replace(/### Pre-Commit Hook Results/, '').trim();
              if (!content || content === '<!-- Paste the output of pre-commit hooks execution to verify all checks passed -->') {
                results.template.failed.push('### Pre-Commit Hook Results (empty)');
              }
            }

            // Output summary
            const dcoFailCount = results.dco.failed.length;
            const gpgFailCount = results.gpg.failed.length;
            const templateFailCount = results.template.failed.length;
            const allPassed = dcoFailCount === 0 && gpgFailCount === 0 && templateFailCount === 0;

            console.log(`DCO: ${results.dco.passed.length} passed, ${dcoFailCount} failed`);
            console.log(`GPG: ${results.gpg.passed.length} passed, ${gpgFailCount} failed`);
            console.log(`Template: ${results.template.passed.length} passed, ${templateFailCount} failed`);

            if (dcoFailCount > 0) {
              console.log('DCO Failed:', JSON.stringify(results.dco.failed, null, 2));
            }
            if (gpgFailCount > 0) {
              console.log('GPG Failed:', JSON.stringify(results.gpg.failed, null, 2));
            }
            if (templateFailCount > 0) {
              console.log('Template Failed:', JSON.stringify(results.template.failed, null, 2));
            }

            // Set outputs
            core.setOutput('dco_failed', JSON.stringify(results.dco.failed));
            core.setOutput('gpg_failed', JSON.stringify(results.gpg.failed));
            core.setOutput('template_failed', JSON.stringify(results.template.failed));
            core.setOutput('dco_passed', results.dco.passed.length);
            core.setOutput('gpg_passed', results.gpg.passed.length);
            core.setOutput('template_passed', results.template.passed.length);
            core.setOutput('all_passed', allPassed);
            core.setOutput('pr_author', prAuthor);
            core.setOutput('base_ref', baseRef);

      - name: Post Verification Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const dcoFailed = JSON.parse('${{ steps.verify.outputs.dco_failed }}');
            const gpgFailed = JSON.parse('${{ steps.verify.outputs.gpg_failed }}');
            const templateFailed = JSON.parse('${{ steps.verify.outputs.template_failed }}');
            const dcoPassed = parseInt('${{ steps.verify.outputs.dco_passed }}');
            const gpgPassed = parseInt('${{ steps.verify.outputs.gpg_passed }}');
            const templatePassed = parseInt('${{ steps.verify.outputs.template_passed }}');
            const allPassed = '${{ steps.verify.outputs.all_passed }}' === 'true';
            const prAuthor = '${{ steps.verify.outputs.pr_author }}';
            const baseRef = '${{ steps.verify.outputs.base_ref }}';

            const commentHeader = "<!-- commit-verification-bot -->";

            let body = "";
            const hasFailures = dcoFailed.length > 0 || gpgFailed.length > 0 || templateFailed.length > 0;

            if (allPassed) {
              body = [
                commentHeader,
                "✅ **Commit Verification Passed**",
                "",
                `Thanks @${prAuthor}! All commits have valid DCO sign-off and GPG signatures, and the PR template is complete. 🎉`,
                "",
                "**Summary:**",
                `- DCO (Signed-off-by): ${dcoPassed} commit(s) ✅`,
                `- GPG Verification: ${gpgPassed} commit(s) ✅`,
                `- PR Template: ${templatePassed} required section(s) ✅`
              ].join("\n");
            } else {
              body = [
                commentHeader,
                "❌ **Commit Verification Failed**",
                "",
                `Hi @${prAuthor}, your pull request has validation failures that must be resolved before merging.`,
                "",
                "This repository requires **all three**:",
                "1. **DCO Sign-off** — Every commit must have a `Signed-off-by` trailer (`git commit -s`)",
                "2. **GPG Verification** — Every commit must be GPG-signed and show **Verified** on GitHub",
                "3. **PR Template** — All required sections must be filled out",
                "",
                "---"
              ].join("\n");

              if (dcoFailed.length > 0) {
                body += "\n### 📝 DCO Sign-off Failures (" + dcoFailed.length + " commit(s))\n";
                body += "These commits are missing `Signed-off-by`:\n\n";
                body += "| Commit | Author | Message |\n";
                body += "|--------|--------|---------|\n";
                for (const c of dcoFailed) {
                  body += `| \`${c.sha.slice(0,7)}\` | ${c.author} <${c.email}> | ${c.message} |\n`;
                }
                body += "\n**Quick Fix (no history rewrite):** Add a remediation commit:\n";
                body += "```bash\n";
                body += `git commit --allow-empty -s -m "DCO Remediation Commit for ${dcoFailed[0].author} <${dcoFailed[0].email}>\n\n`;
                for (const c of dcoFailed) {
                  body += `I, ${c.author} <${c.email}>, hereby add my Signed-off-by to this commit: ${c.sha}\n`;
                }
                body += '`\n';
                body += "git push\n```\n";
                body += "\n*Or sign each commit directly:* `git rebase --signoff origin/${baseRef} && git push --force-with-lease`\n";
              }

              if (gpgFailed.length > 0) {
                body += "\n### 🔐 GPG Verification Failures (" + gpgFailed.length + " commit(s))\n";
                body += "These commits are **not GPG-verified** on GitHub:\n\n";
                body += "| Commit | Author | Reason | Message |\n";
                body += "|--------|--------|--------|---------|\n";
                for (const c of gpgFailed) {
                  const reason = c.reason || 'unsigned';
                  body += `| \`${c.sha.slice(0,7)}\` | ${c.author} <${c.email}> | ${reason} | ${c.message} |\n`;
                }
                body += "\n**Fix:** You must GPG-sign all commits. See [Verified Commits setup guide](https://github.com/IBM/docling-pipelines/blob/main/CONTRIBUTING.md#verified-commits).\n\n";
                body += "**Single commit:**\n";
                body += "```bash\n";
                body += "git commit --amend --signoff -S\n";
                body += "git push --force-with-lease\n";
                body += "```\n\n";
                body += "**Multiple commits:**\n";
                body += "```bash\n";
                body += "git rebase --exec 'git commit --amend --signoff -S --no-edit' origin/${baseRef}\n";
                body += "git push --force-with-lease\n";
                body += "```\n\n";
                body += "> **Note:** GPG signing (`-S`) is separate from DCO sign-off (`-s`). **Both are required.**\n";
              }

              if (templateFailed.length > 0) {
                body += "\n### 📋 PR Template Validation Failures\n";
                body += "Missing or incomplete required section(s):\n\n";
                for (const section of templateFailed) {
                  body += `- \`${section}\`\n`;
                }
                body += "\nPlease fill out all sections of the PR template before requesting review.\n";
                body += "See the [PR template](.github/pull_request_template.md) for reference.\n";
              }

              body += "\n---\n";
              body += `**Summary:** DCO: ${dcoPassed} passed, ${dcoFailed.length} failed | GPG: ${gpgPassed} passed, ${gpgFailed.length} failed | Template: ${templatePassed} passed, ${templateFailed.length} failed`;
            }

            // Upsert bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber
            });

            const existingComment = comments.find(c => c.body.includes(commentHeader));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

      - name: Fail Workflow if Verification Failed
        if: steps.verify.outputs.all_passed != 'true'
        run: |
          echo "::error::Commit verification failed - see bot comment for details"
          exit 1
