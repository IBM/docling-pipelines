name: Docs — Build & Deploy to GitHub Pages

on:
  push:
    branches: [docs/main]
    paths:
      - 'docs/**'
  workflow_dispatch:   # allow manual trigger from the Actions tab

# Only one deployment at a time
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the entire docs/ folder.
          # - docs/index.html        → https://ibm.github.io/docling-pipelines/
          # - docs/QUICKSTART.html   → https://ibm.github.io/docling-pipelines/QUICKSTART.html
          # - docs/book/site/…       → Antora book (pre-built, committed to repo)
          # - docs/api/, docs/guides/… → generated HTML reference pages
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
